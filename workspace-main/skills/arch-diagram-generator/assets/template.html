<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg-primary: #020617;
    --bg-secondary: #0f172a;
    --bg-card: #1e293b;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: #334155;
    --grid-color: rgba(51, 65, 85, 0.3);

    /* Semantic colors */
    --color-frontend: #06b6d4;
    --color-backend: #10b981;
    --color-database: #a855f7;
    --color-cloud: #f59e0b;
    --color-security: #f43f5e;
    --color-messaging: #8b5cf6;
    --color-gateway: #ec4899;
    --color-cache: #14b8a6;
    --color-storage: #6366f1;
    --color-monitoring: #84cc16;
    --color-default: #64748b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Microsoft YaHei', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 32px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 20px;
    font-size: 13px;
    color: var(--color-backend);
  }

  .status-dot {
    width: 8px; height: 8px;
    background: var(--color-backend);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  /* Diagram Area */
  .diagram-section {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 32px;
    overflow-x: auto;
  }

  .diagram-section svg {
    display: block;
    width: 100%;
    height: auto;
    min-height: 400px;
  }

  /* Summary Cards */
  .summary-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  .summary-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    transition: border-color 0.2s, transform 0.2s;
  }

  .summary-card:hover {
    border-color: var(--text-muted);
    transform: translateY(-2px);
  }

  .summary-card .card-icon {
    font-size: 24px;
    margin-bottom: 12px;
  }

  .summary-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--text-primary);
  }

  .summary-card p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  .summary-card .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
  }

  .card-tag {
    padding: 3px 10px;
    font-size: 12px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    color: var(--text-secondary);
  }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    padding: 16px 0;
    margin-bottom: 24px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 3px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }

  .footer span { margin: 0 12px; }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>{{TITLE}}</h1>
    <div class="status-indicator">
      <span class="status-dot"></span>
      Architecture Overview
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <!-- LEGEND_PLACEHOLDER -->
  </div>

  <!-- Architecture Diagram -->
  <div class="diagram-section">
    <!-- DIAGRAM_PLACEHOLDER -->
  </div>

  <!-- Summary Cards -->
  <div class="summary-cards">
    <!-- CARDS_PLACEHOLDER -->
  </div>

  <!-- Footer -->
  <div class="footer">
    Generated by Arch Diagram Generator<span>|</span>{{TIMESTAMP}}
  </div>

</div>
</body>
</html>
